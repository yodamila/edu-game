<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penjumlahan Apel 🍎</title>
<style>
*{box-sizing:border-box;font-family:Helvetica, Arial, sans-serif}
body{background-size:cover;background-position:center;background-repeat:no-repeat;margin:0;min-height:100vh;background:linear-gradient(#dff3ff,#fff);overflow:hidden}
.home,.game{background:transparent;height:100vh;text-align:center}
.home{background:transparent;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative}
h1{color:#4c91d9;font-size:42px;z-index:2}
p{font-size:22px;z-index:2}
input{padding:15px;border-radius:25px;border:0;font-size:20px;text-align:center;width:260px;z-index:2}
button{padding:15px 30px;border:0;border-radius:30px;background:#8ed0ff;font-size:22px;margin:15px;cursor:pointer}
.emoji{position:absolute;bottom:-50px;font-size:35px;animation:up 8s linear infinite}
@keyframes up{to{transform:translateY(-120vh) rotate(360deg)}}
.game{background:transparent;display:none;padding:20px}
.info{background:#fff;border-radius:25px;padding:10px;display:inline-block}.apple{display:inline-block;animation:pop .3s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.merge{animation:merge 1s}
@keyframes merge{50%{transform:scale(1.5)}}
.answer-btn{width:100px;height:80px;background:#ffd6e7;font-size:35px}
#message{font-size:30px;height:45px}

.formula{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    margin:25px;
    font-size:40px;
}

.formula-box{
    background:#ffe6b8;
    border-radius:25px;
    min-width:130px;
    min-height:90px;
    padding:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:45px;
}

.operator{
    font-size:45px;
    color:#4c91d9;
    font-weight:bold;
}

.answer-box{
    background:#ffd6e7;
}

<body>

<div class="home" id="home">
<h1>🍎 Penjumlahan Apel 🍎</h1>
<p>Belajar berhitung sambil bermain!</p>
<input id="name" placeholder="Nama kamu 😊">
<button onclick="start()">Mulai Bermain 🚀</button>
</div>

<div class="game" id="game">
<h2>Halo <span id="player"></span> 🌟</h2>
<div class="info">Level <span id="level">1</span>/10 | Skor <span id="score">0</span></div>
<h2>Berapa jumlah apel semuanya?</h2>
<div class="formula">
    <div class="formula-box" id="box1"></div>
    <div class="operator">+</div>
    <div class="formula-box" id="box2"></div>
    <div class="operator">=</div>
    <div class="formula-box answer-box">?</div>
</div>

<div id="answers"></div>
<div id="message"></div>
</div>

<script>
let name="",level=1,score=0,a,b,total;

["🍎","🍌","🐱","🐶","🌈","⭐","🦋","🌸","🍭","🐰","🍓","🌻","🚀","🎈","🐼","🍪","🌙","☁️","🧸","🎁"].forEach(e=>{
let x=document.createElement("div");
x.className="emoji";x.innerHTML=e;
x.style.left=Math.random()*95+"%";
x.style.animationDelay=Math.random()*5+"s";
document.querySelector(".home").appendChild(x);
});

function start(){
name=document.getElementById("name").value.trim();
if(!name)return alert("Isi nama dulu ya 😊");
document.getElementById("player").innerHTML=name;
home.style.display="none";
game.style.display="block";
level=1;score=0;
question();
}

function question(){
document.getElementById("level").innerHTML=level;
document.getElementById("score").innerHTML=score;
do{
a=Math.floor(Math.random()*5)+1;
b=Math.floor(Math.random()*5)+1;
}while(a+b>5);
total=a+b;

document.getElementById("box1").innerHTML="🍎".repeat(a);
document.getElementById("box2").innerHTML="🍎".repeat(b);

let arr=[total];
while(arr.length<3){
let n=Math.ceil(Math.random()*5);
if(!arr.includes(n))arr.push(n);
}
arr.sort(()=>Math.random()-0.5);

answers.innerHTML="";
arr.forEach(n=>{
let btn=document.createElement("button");
btn.className="answer-btn";
btn.innerHTML=n;
btn.onclick=()=>check(n);
answers.appendChild(btn);
});
message.innerHTML="";
}

function check(n){
if(n==total){
score++;
document.querySelectorAll(".apple").forEach(x=>x.classList.add("merge"));
pop();
message.innerHTML="Benar! 🎉";
setTimeout(()=>{
if(level<10){level++;question()}
else{
alert("Hebat "+name+"! Selesai 10 level 🎊");
home.style.display="flex";
game.style.display="none";
name.value="";
}
},1000);
}else{
message.innerHTML="Coba lagi 😊";
}
}

function pop(){
let c=new(window.AudioContext||window.webkitAudioContext)();
let o=c.createOscillator();
o.frequency.value=700;
o.connect(c.destination);
o.start();
o.stop(c.currentTime+.15);
}
</script>
</body>
</html>
