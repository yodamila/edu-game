<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard Color</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap');

*{box-sizing:border-box}
body{
margin:0;min-height:100vh;font-family:'Baloo 2',cursive;
background:#9fd8ff;
background-image:radial-gradient(white 2px,transparent 2px);
background-size:28px 28px;
display:flex;justify-content:center;align-items:center;
}

.start,.finish{
width:100%;height:100vh;display:flex;flex-direction:column;
justify-content:center;align-items:center;text-align:center;
}

.logo{width:85%;max-width:420px}

.play,.again{
margin-top:35px;padding:16px 65px;border:0;border-radius:50px;
background:#ff7eb8;color:white;font-size:32px;
font-family:inherit;cursor:pointer;
box-shadow:0 8px 0 #dc5b94;
}

#game{display:none;width:95%;max-width:430px;text-align:center}

h1{color:#5d4bc4;font-size:40px}

.info{font-size:22px;color:#555}

.card{
background:white;border:12px solid #b39aff;border-radius:40px;
padding:30px;animation:pop .3s;
}

@keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}

.color{
width:210px;height:210px;border-radius:40px;margin:15px auto;
}

button.answer{
width:90%;padding:14px;margin:7px;border:0;border-radius:25px;
background:#c4b5fd;color:white;font-size:25px;font-family:inherit;
cursor:pointer;
}

.message{font-size:24px;color:#555;min-height:35px}

.finish{
display:none;color:#5d4bc4;font-size:28px;
}
</style>
</head>

<div id="game">
<h1>🌈 Colors</h1>
<div class="info">Color <span id="num">1</span>/12</div>
<div class="info">⭐ Score: <span id="score">0</span></div>

<div class="card">
<div id="box" class="color"></div>
<h2 id="question"></h2>
<div id="answers"></div>
<div id="message" class="message">Choose the answer 😊</div>
</div>
</div>

<div id="finish" class="finish">
<h1>🎉 Amazing!</h1>
<p>You learned all colors!</p>
<p>⭐ Score: <span id="final"></span>/12</p>
<button class="again" onclick="restart()">Play Again 🔄</button>
</div>


<script>
const colors=[
["Merah","Red","#ef233c"],["Biru","Blue","#4dabf7"],
["Kuning","Yellow","#ffd43b"],["Hijau","Green","#69db7c"],
["Ungu","Purple","#b197fc"],["Oranye","Orange","#ffa94d"],
["Pink","Pink","#ff87c8"],["Hitam","Black","#333333"],
["Putih","White","#ffffff"],["Cokelat","Brown","#9c6644"],
["Abu-abu","Gray","#adb5bd"],["Emas","Gold","#ffd700"]
];

let list=[],index=0,score=0,locked=false;

function shuffle(arr){
return arr.sort(()=>Math.random()-0.5);
}

function startGame(){
document.getElementById("start").style.display="none";
document.getElementById("game").style.display="block";
list=shuffle([...colors]);
load();
}

function load(){
locked=false;
let c=list[index];

document.getElementById("num").innerHTML=index+1;
document.getElementById("box").style.background=c[2];
document.getElementById("question").innerHTML=c[0]+" adalah?";

let choices=[c[1]];
while(choices.length<3){
let r=colors[Math.floor(Math.random()*colors.length)][1];
if(!choices.includes(r)) choices.push(r);
}
shuffle(choices);

document.getElementById("answers").innerHTML=
choices.map(x=>`<button class="answer" onclick="check('${x}')">${x}</button>`).join("");

document.getElementById("message").innerHTML="Choose the answer 😊";
}

function check(a){
if(locked)return;

if(a===list[index][1]){
locked=true;
score++;
document.getElementById("score").innerHTML=score;
document.getElementById("message").innerHTML=
"🎉 Correct! "+list[index][0]+" = "+a;

setTimeout(()=>{
index++;
if(index>=12) finish();
else load();
},1000);

}else{
document.getElementById("message").innerHTML="❌ Try Again";
}
}

function finish(){
document.getElementById("game").style.display="none";
document.getElementById("finish").style.display="flex";
document.getElementById("final").innerHTML=score;
}

function restart(){
index=0;score=0;
document.getElementById("score").innerHTML=0;
document.getElementById("finish").style.display="none";
document.getElementById("game").style.display="block";
list=shuffle([...colors]);
load();
}
</script>
